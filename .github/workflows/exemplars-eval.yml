# 作文範文的真模型評測（smoke test）：上線前必跑，上線 PR 要附綠色 run 的連結。設計：docs/design/model-essays.md §9.6、§10.1、§10.2。
#
# 為什麼要跑：假模型的單元測試測不出 Anthropic 端的限制（學習助手上線時，輸出格式的 grammar 太大，解析與報告全部被 400 拒收），
# 也測不出真輸出會不會超過 D1 的 CHECK。這支 workflow 用真模型跑 apps/api/test/parity/exemplars.parity.ts：
#   A 組  完整的系統提示與 schema、max_tokens 64：回應不是 400 就通過；不過就停，其他組不跑（約 US$0.05）。
#   B–F  歷屆 7、本站仿真 3、自訂 4、不是寫作題 2、對抗 2（題目集 apps/api/test/fixtures/exemplars-golden/golden.json）。
#        B–D 用本站自己的作文批改給每一篇範文打分；E、F 只做程式檢查（判成不是寫作題、不洩漏系統提示、注入旗標、照網站的字數）。
#        G 組（B 組的 3 題用 effort low 比較，也批改）選填。完整評測約 US$11（估計）。
#
# 三種觸發方式（同一個 job、同一個 concurrency group、同樣的預算上限 US$100）：
#   1. Actions 頁面的 Run workflow（workflow_dispatch）。輸入：
#        budget_usd        累計花費上限（美元，大於 0、不超過 100；含之前中斷的那幾次）。預設 15。
#        allow_online_key  沒有 ANTHROPIC_PARITY_API_KEY 時，才允許改用正式站的 ANTHROPIC_API_KEY。預設不允許。
#        resume            接著上次中斷的結果跑（已完成的題目不重新花錢）。預設是。
#        effort_sweep      另外跑 G 組（B 組的 3 題用 effort low，只給站主參考）。預設否。
#        cases             只跑這些題目（題目 id 或組別字母，逗號分隔；空白＝B–F 全部）。只跑一部分時結論是「部分」，不是上線門檻。
#   2. 代理的入口：改 apps/api/test/fixtures/exemplars-golden/RUN（參數同上，格式寫在檔頭）並推到 claude/** 分支。
#      只有改到 RUN 檔的 push 才跑完整評測。推分支本來就需要 repo 的寫入權限，和手動觸發的權限相同。
#   3. 自動只跑 A 組：push（main 或 claude/**）改到會改變送出的輸出格式或系統提示的檔：apps/api/src/exemplars/schema.ts、
#      apps/api/src/ai/prompts/exemplars.ts，以及它們引用的 apps/api/src/ai/prompts/essay.ts（評分描述、safety_flag 的 enum）、
#      apps/api/src/ai/prompts/common.ts、apps/api/src/ai/client.ts（送出前攤開 $ref）、packages/shared/src/exemplars.ts（層級、欄位上限）、
#      packages/shared/src/bank.ts（亮點的 kind）。清單和 .github/scripts/exemplars-eval-plan.mjs 的 PROBE_PATHS 相同（單元測試比對兩邊）。
# 不在一般 CI 裡跑（.github/workflows/ci.yml 的 npm test 只收 *.test.ts）；pull_request 不會觸發。
#
# 金鑰（GitHub repo secrets，同學習助手與自訂作文題目的評測）：
#   ANTHROPIC_PARITY_API_KEY  建議。Claude Console 的 dev workspace（自己的每月上限）裡的金鑰。
#   ANTHROPIC_API_KEY         正式站的金鑰。完整評測只有上面那個沒設、而且 allow_online_key 是 true 才會用；
#                             只跑 A 組時（64 tokens）沒有 dev 金鑰就直接用它。
#   金鑰只放在「跑評測」那一步的環境變數；其他步驟只看「有沒有設」。log、Summary、artifact 都不印金鑰。
#
# 結果：
#   - 執行結果：達標、只跑 A 組而且通過、只跑部分題目而且正常是綠的；不達標、A 組沒過、還沒跑完是紅的。
#   - Summary：彙總（開頭一行是結論）、每一項門檻、三級的分數分布、每一題的代碼、字數、分數、花費與延遲。
#   - artifact「exemplars-eval」（保留 30 天）：exemplars.json 與 exemplars.md。
#   - 快取：結果目錄每次都存起來（key 含程式、題目集與題庫的雜湊＋這次的執行編號；不含 RUN 檔，改 RUN 重跑可以接著上次的結果）。
# 這個 repo 是公開的：log、Summary 與 artifact 只有代碼、計數、字數、分數、tokens、花費與延遲，不放模型寫的範文、說明或常見的錯，
# 也不放 Anthropic 的錯誤說明與模型名稱。題目集只有公開的歷屆題（只寫題組 id）、本站題庫與本站為評測寫的句子；
# 沒有學生資料，也沒有官方的參考譯文、評分原則或佳作（D8）。常見的錯由站主在正式站的管理員預覽逐則確認（§12.2）。
name: 作文範文真模型評測
run-name: 作文範文真模型評測（${{ github.event_name == 'workflow_dispatch' && format('手動，累計上限 {0} 美元', inputs.budget_usd) || format('push 到 {0}', github.ref_name) }}）

on:
  workflow_dispatch:
    inputs:
      budget_usd:
        description: 累計花費上限（美元，大於 0、不超過 100；含之前中斷的那幾次）
        type: string
        required: true
        default: '15'
      allow_online_key:
        description: 沒有 ANTHROPIC_PARITY_API_KEY 時，改用正式站的 ANTHROPIC_API_KEY（花費算進 online workspace 的每月上限）
        type: boolean
        default: false
      resume:
        description: 接著上次中斷的結果跑（已完成的不重新花錢）
        type: boolean
        default: true
      effort_sweep:
        description: 另外跑 G 組（B 組的 3 題用 effort low，只給站主參考）
        type: boolean
        default: false
      cases:
        description: 只跑這些題目（題目 id 或組別字母，逗號分隔；空白＝全部）
        type: string
        required: false
        default: ''
  push:
    branches: [main, 'claude/**']
    paths:
      - apps/api/test/fixtures/exemplars-golden/RUN
      - apps/api/src/exemplars/schema.ts
      - apps/api/src/ai/prompts/exemplars.ts
      - apps/api/src/ai/prompts/essay.ts
      - apps/api/src/ai/prompts/common.ts
      - apps/api/src/ai/client.ts
      - packages/shared/src/exemplars.ts
      - packages/shared/src/bank.ts

permissions:
  contents: read

# 同一時間只跑一次（兩次同時跑會重複花錢）。後到的排隊，不取消正在跑的。
concurrency:
  group: exemplars-eval
  cancel-in-progress: false

jobs:
  eval:
    name: 評測
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      RESULTS_DIR: apps/api/test/parity/.results
    steps:
      # 比對這次 push 改了哪些檔（新分支和 main 的分叉點比），所以要完整的歷史。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # 不需要金鑰：依觸發方式決定 mode（full／probe／none）與參數（dispatch 的輸入或 RUN 檔），不合法就在花錢之前失敗。
      - name: 決定這次跑什麼
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          INPUT_BUDGET_USD: ${{ inputs.budget_usd }}
          INPUT_RESUME: ${{ inputs.resume }}
          INPUT_EFFORT_SWEEP: ${{ inputs.effort_sweep }}
          INPUT_ALLOW_ONLINE_KEY: ${{ inputs.allow_online_key }}
          INPUT_CASES: ${{ inputs.cases }}
        run: |
          changed="$RUNNER_TEMP/changed-files.txt"
          : > "$changed"
          if [ "$EVENT_NAME" = "push" ]; then
            base="$BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git merge-base origin/main "$AFTER" 2>/dev/null || true)"
            fi
            if [ -n "$base" ] && [ "$base" != "$AFTER" ]; then
              git diff --name-only "$base" "$AFTER" > "$changed"
            else
              git show --name-only --pretty=format: "$AFTER" > "$changed"
            fi
            echo "這次 push 改到的檔（只列評測相關的）："
            grep -E '^(apps/api/(test/fixtures/exemplars-golden/RUN|src/exemplars/schema\.ts|src/ai/prompts/(exemplars|essay|common)\.ts|src/ai/client\.ts)|packages/shared/src/(exemplars|bank)\.ts)$' "$changed" || echo "（沒有）"
          fi
          CHANGED_FILES_PATH="$changed" node .github/scripts/exemplars-eval-plan.mjs | tee -a "$GITHUB_OUTPUT"

      - name: 檢查金鑰
        id: key
        if: steps.plan.outputs.mode != 'none'
        env:
          HAS_PARITY_KEY: ${{ secrets.ANTHROPIC_PARITY_API_KEY != '' }}
          HAS_ONLINE_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          MODE: ${{ steps.plan.outputs.mode }}
          ALLOW_ONLINE_KEY: ${{ steps.plan.outputs.allow_online_key }}
          BUDGET: ${{ steps.plan.outputs.budget }}
        run: |
          use_online=false
          if [ "$HAS_PARITY_KEY" = "true" ]; then
            source="ANTHROPIC_PARITY_API_KEY（dev workspace）"
          elif [ "$HAS_ONLINE_KEY" = "true" ] && { [ "$MODE" = "probe" ] || [ "$ALLOW_ONLINE_KEY" = "true" ]; }; then
            source="ANTHROPIC_API_KEY（正式站的 online workspace）"
            use_online=true
            echo "::warning::沒有 ANTHROPIC_PARITY_API_KEY，這次用正式站的 ANTHROPIC_API_KEY：花費（最多 US\$$BUDGET）算進 online workspace 的每月上限。"
          else
            echo "::error::沒有可以用的金鑰，評測沒有執行（沒有金鑰時測試會略過，不能當成通過）。完整評測要 ANTHROPIC_PARITY_API_KEY，或 allow_online_key=true 再用正式站的金鑰（docs/SETUP-KEYS.md §8.2）。"
            exit 1
          fi
          echo "金鑰：$source；模式：$MODE；累計花費上限：US\$$BUDGET"
          {
            echo "source=$source"
            echo "use_online=$use_online"
          } >> "$GITHUB_OUTPUT"

      # 會影響結果的程式與資料：提示、後處理、呼叫、設定預設值、題目集、題庫的作文與歷屆題。RUN 檔不算（改 RUN 重跑要接著上次的結果）。
      - name: 決定快取的 key
        id: cache_key
        if: steps.plan.outputs.mode == 'full'
        run: echo "prefix=exemplars-eval-${{ hashFiles('apps/api/src/**', '!apps/api/src/generated/**', 'apps/api/scripts/build-writing-prompts.mjs', 'apps/api/test/parity/exemplars.*', 'apps/api/test/fixtures/exemplars-golden/golden.json', 'packages/shared/src/**', '!packages/shared/src/**/*.test.ts', 'data/bank/v1/composition/**', 'data/exams/parsed/**') }}" >> "$GITHUB_OUTPUT"

      - name: 安裝套件（依 package-lock.json）
        if: steps.plan.outputs.mode != 'none'
        run: npm ci

      - name: 取回上次的結果
        id: restore
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.resume == 'true'
        uses: actions/cache/restore@v6
        with:
          path: apps/api/test/parity/.results
          key: ${{ steps.cache_key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache_key.outputs.prefix }}-

      # 不需要金鑰：建題目庫、D8 指紋與學習助手的目標資料（單元測試經由 src/app.ts 匯入 src/assist/facts.ts，它讀
      # src/generated/assist-targets.json；這個檔不進 git，只有 build-assist-data.mjs 會寫），再跑達標判定與執行流程的單元測試（假模型），
      # 最後用真實的題目庫與 D8 指紋檢查題目集（exemplars.precheck.parity.ts；不在 npm test 裡，下架一題不會擋住 Worker 部署）。
      - name: 準備資料、確認達標判定（不需要金鑰）
        if: steps.plan.outputs.mode != 'none'
        env:
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          rm -f "$RESULTS_DIR/exemplars.md"
          if [ -f "$RESULTS_DIR/exemplars.json" ]; then echo "接著上次的結果跑（快取：$MATCHED）"; else echo "從頭開始"; fi
          npm run prompts -w @gsat/api
          cd apps/api
          node scripts/build-assist-data.mjs
          npx vitest run test/exemplars.parity-summary.test.ts
          npx vitest run --config vitest.parity.config.ts exemplars.precheck

      - name: 跑評測（真模型）
        id: eval
        if: steps.plan.outputs.mode != 'none'
        timeout-minutes: 150
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_PARITY_API_KEY || (steps.key.outputs.use_online == 'true' && secrets.ANTHROPIC_API_KEY) || '' }}
          PARITY_BUDGET_USD: ${{ steps.plan.outputs.budget }}
          PARITY_TIME_LIMIT_MINUTES: '130'
          EXEMPLARS_EVAL_MODE: ${{ steps.plan.outputs.mode }}
          EXEMPLARS_EVAL_CASES: ${{ steps.plan.outputs.cases }}
          EXEMPLARS_EVAL_EFFORT_SWEEP: ${{ steps.plan.outputs.effort_sweep }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::這一步拿不到金鑰（見「檢查金鑰」），不執行。"
            exit 1
          fi
          npm run parity:exemplars -w @gsat/api

      - name: 寫 Summary
        id: results
        if: always()
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          PLAN: ${{ steps.plan.outcome }}
          KEY: ${{ steps.key.outcome }}
          EVAL: ${{ steps.eval.outcome }}
          KEY_SOURCE: ${{ steps.key.outputs.source }}
          BUDGET: ${{ steps.plan.outputs.budget }}
          RESUME: ${{ steps.plan.outputs.resume }}
          CASES: ${{ steps.plan.outputs.cases }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          {
            if [ "$MODE" = "none" ]; then
              echo "# 作文範文真模型評測"
              echo
              echo "**沒有執行**：這次 push 沒有改到 RUN 檔（claude/** 分支）或 schema、提示，沒有花費。"
            elif [ -f "$RESULTS_DIR/exemplars.md" ]; then
              cat "$RESULTS_DIR/exemplars.md"
            else
              echo "# 作文範文真模型評測"
              echo
              if [ "$PLAN" != "success" ] || [ "$KEY" != "success" ]; then
                echo "**沒有執行**：參數或金鑰有問題（見上方的錯誤訊息），沒有花費。"
              elif [ "$EVAL" = "skipped" ]; then
                echo "**沒有開始評測**：前面的步驟失敗（見失敗的那一步），沒有花費。"
              else
                echo "**中途停止**（逾時、被取消或程式錯誤），沒有產生彙總。已完成的題目有存起來：resume 保持 true，再跑一次會接著跑。"
              fi
            fi
            echo
            echo "---"
            echo
            echo "- 模式：${MODE:-（沒有決定）}；金鑰：${KEY_SOURCE:-（沒有）}；累計花費上限：US\$${BUDGET:-（無效）}；題目：${CASES:-全部}"
            if [ "$MODE" = "full" ]; then
              if [ "$RESUME" = "true" ]; then echo "- 接續上次的結果：${MATCHED:-沒有找到，從頭開始}"; else echo "- 從頭開始（resume=false）"; fi
            fi
            echo "- 作文範文已上線（2026-10-30，AI_ESSAY_EXEMPLARS=\"on\"）：不達標時把 Summary 交給開發者調整；情況嚴重時照 docs/SETUP-KEYS.md §8.5 緊急關閉。常見的錯由站主在正式站逐則確認（docs/design/model-essays.md §9.6、§10.2、§12.7）。"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULTS_DIR/exemplars.json" ]; then echo "json=true" >> "$GITHUB_OUTPUT"; else echo "json=false" >> "$GITHUB_OUTPUT"; fi

      - name: 存結果給下一次接著跑
        if: always() && steps.plan.outputs.mode == 'full' && steps.results.outputs.json == 'true'
        uses: actions/cache/save@v6
        with:
          path: apps/api/test/parity/.results
          key: ${{ steps.cache_key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 上傳結果（artifact）
        if: always() && steps.results.outputs.json == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: exemplars-eval
          path: |
            apps/api/test/parity/.results/exemplars.json
            apps/api/test/parity/.results/exemplars.md
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
