# 臨時診斷（只在開發分支，不合併進 main）：正式站的學習助手解析回 api_error，用真模型跑幾題、印出 Anthropic 的錯誤說明。
# 花費上限 US$1；只印錯誤代碼與說明，不印提示詞、輸出或金鑰。查完就刪掉這個檔案。
name: 學習助手錯誤診斷（臨時）
on:
  push:
    branches: [claude/lucid-pasteur-0lggvt]
    paths: ['.github/workflows/tmp-assist-diag.yml', 'apps/api/scripts/tmp-schema-probe.ts']
permissions:
  contents: read
concurrency:
  group: assistant-eval
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 準備資料（不需要金鑰）
        run: |
          npm run build:data -w @gsat/web
          npm run prompts -w @gsat/api
          cd apps/api && node scripts/build-assist-data.mjs
      - name: 探測 schema（真模型，每題 64 tokens）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_PARITY_API_KEY || secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::沒有金鑰"; exit 1; fi
          cd apps/api && npx tsx scripts/tmp-schema-probe.ts 2>&1 | grep "\[probe\]" || true
